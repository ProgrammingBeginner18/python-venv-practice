name: Test and Deploy FastAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-and-publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check code quality with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: mhaseeb23/python-venv-practice:latest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy on EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-09285cef50d44f326" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "docker pull mhaseeb23/python-venv-practice:latest",
              "docker stop fastapi-api || true",
              "docker rm fastapi-api || true",
              "docker run -d --name fastapi-api --restart unless-stopped -p 80:8000 mhaseeb23/python-venv-practice:latest"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0bd69ab2a7411d7d7"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0bd69ab2a7411d7d7" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json
